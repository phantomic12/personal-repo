name: Add AUR package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'AUR package name to add to the repo'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate + vendor + register package
        id: add
        run: |
          python3 scripts/add-package.py "${{ inputs.package }}"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory '*'
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          # add-package.py may vendor multiple packages (AUR-only dep closure),
          # so stage every package dir it touched, not just the requested one.
          git add packages.json packages/
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "add package: ${{ inputs.package }} (+AUR dep closure)"
            git push origin HEAD:main
            echo "pushed."
          fi

      - name: Dispatch poll workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run poll.yaml --repo "${{ github.repository }}"
          echo "dispatched poll workflow — it will detect the new package and trigger a build"
